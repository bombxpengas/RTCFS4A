name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      # The Live RAM feature ships a small native helper (app/src/main/cpp),
      # built via CMake. Neither the NDK nor CMake are part of the base SDK
      # setup-android installs, so the native build step fails without this.
      # Versions pinned here match app/build.gradle.kts's ndkVersion and the
      # cmake { version = ... } in app/src/main/cpp's Gradle wiring — bump
      # both places together if you ever change one.
      - name: Install NDK and CMake
        run: sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      # Pins an exact Gradle version and puts it on PATH, handles caching of
      # ~/.gradle automatically, and is used for every `gradle`/`./gradlew`
      # call below. This avoids depending on whatever Gradle happens to be
      # preinstalled on the runner image (which drifts over time and caused
      # a build failure here when it didn't match this project's Android
      # Gradle Plugin version).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # This repo doesn't commit the Gradle wrapper jar. If you add it later
      # (recommended for reproducible builds — run
      # `gradle wrapper --gradle-version 8.7` once locally, then commit
      # gradlew, gradlew.bat, and gradle/wrapper/*), this step becomes a no-op.
      - name: Ensure Gradle wrapper exists
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x ./gradlew
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
